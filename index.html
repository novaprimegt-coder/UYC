<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#29222e">
<meta name="description" content="UYC: catálogo central de empresas, marcas, plataformas y recursos oficiales.">
<title>UYC · Empresas y marcas</title>
<link rel="stylesheet" href="css/styles.css?v=4.0.0">
<script defer src="data/records.js?v=4.0.0"></script>
<script defer src="js/app.js?v=4.0.0"></script>
</head>
<body>
<div class="shell">
 <aside id="siteMenu" class="site-menu" aria-label="Navegación UYC" aria-hidden="true" hidden>
  <div class="menu-head">
   <div><strong class="sidebar-brand">UYC<span>.</span></strong><small>Espacio empresarial</small></div>
   <button id="menuClose" class="menu-close" type="button" aria-label="Cerrar menú">✕</button>
  </div>
  <nav id="menuLinks" class="menu-links" aria-label="Secciones de UYC"></nav>
  <div class="menu-footnote"><span class="foot-dot"></span>Consulta privada de claves · Datos públicos de solo lectura</div>
 </aside>
 <div id="menuBackdrop" class="menu-backdrop" hidden></div>
 <div class="workspace">
  <header class="topbar">
   <div class="top-inner">
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú de navegación" aria-controls="siteMenu" aria-expanded="false">
     <span></span><span></span><span></span>
    </button>
    <button class="brand" id="brandHome" type="button" aria-label="Volver al directorio">
     <span class="brand-wordmark">UYC<span class="brand-accent">.</span></span>
     <span class="brand-label">EMPRESAS Y MARCAS</span>
    </button>
    <span class="top-spacer"></span>
    <label class="header-search"><span class="search-icon" aria-hidden="true">⌕</span>
     <input id="search" type="search" placeholder="Buscar una empresa..." aria-label="Buscar empresas en UYC" autocomplete="off">
    </label>
    <button id="goDirectory" class="header-back" type="button" hidden>← Directorio</button>
   </div>
  </header>
  <main id="app" class="layout" aria-live="polite">
   <div class="loading"><span class="loading-dot"></span>Cargando empresas...</div>
  </main>
  <footer class="footer"><span class="footer-logo">UYC<span>.</span></span><span>Tu información empresarial, en orden.</span><small>Consulta, copia y descarga</small></footer>
 </div>
</div>
<nav id="mobileDock" class="mobile-dock" aria-label="Navegación rápida" hidden></nav>
<div id="modalCover" class="modal-cover" hidden>
 <div class="modal" role="dialog" aria-modal="true" aria-label="Vista o caja fuerte" id="modalBox">
  <button type="button" class="modal-close" id="closeModal" aria-label="Cerrar">✕</button>
  <div id="modalBody"></div>
 </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">Activa JavaScript para consultar UYC.</p></noscript>
</body>
</html>
