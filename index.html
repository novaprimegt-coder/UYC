<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
 <meta name="theme-color" content="#fbf7f2">
 <meta name="description" content="UYC: archivo visual de empresas, proyectos, marcas, logos, redes sociales y repositorios oficiales.">
 <title>UYC · Archivo empresarial</title>
 <link rel="stylesheet" href="css/styles.css?v=5.0.0">
 <script defer src="data/records.js?v=5.0.0"></script>
 <script defer src="js/app.js?v=5.0.0"></script>
</head>
<body>
 <div class="app-shell">
  <header class="topbar">
   <div class="top-inner">
    <button type="button" id="menuToggle" class="menu-toggle" aria-label="Abrir menú" aria-controls="siteMenu" aria-expanded="false">
     <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <button class="brand" type="button" id="brandHome" aria-label="Volver a todas las empresas">
     <strong class="brand-wordmark">UYC<span>.</span></strong>
     <span class="brand-suffix">Archivo empresarial</span>
    </button>
    <div class="head-spacer"></div>
    <label class="header-search">
     <span class="search-icon" aria-hidden="true">⌕</span>
     <input id="search" type="search" autocomplete="off" placeholder="Buscar empresa" aria-label="Buscar empresa o marca">
    </label>
    <button class="header-back" type="button" id="goDirectory" hidden>← Empresas</button>
   </div>
  </header>
  <main id="app" class="layout" aria-live="polite">
   <div class="loading">Cargando el archivo de empresas…</div>
  </main>
  <footer class="footer"><div class="footer-inner"><span class="footer-logo">UYC<span>.</span></span><span>Información oficial, en un solo lugar.</span><small>Consulta · Copia · Descarga</small></div></footer>
 </div>
 <div id="menuBackdrop" class="menu-backdrop" hidden></div>
 <aside class="site-menu" id="siteMenu" aria-label="Navegación principal" aria-hidden="true" hidden>
  <div class="menu-head"><div><strong class="sidebar-brand">UYC<span>.</span></strong><small>Ir directamente a</small></div><button class="menu-close" type="button" id="menuClose" aria-label="Cerrar menú">✕</button></div>
  <nav class="menu-links" id="menuLinks" aria-label="Empresas y apartados"></nav>
  <div class="menu-footnote">Información empresarial de solo lectura. Las claves se guardan cifradas en tu dispositivo.</div>
 </aside>
 <nav id="mobileDock" class="mobile-dock" aria-label="Navegación heredada" hidden></nav>
 <div class="modal-cover" id="modalCover" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-label="Vista previa o caja fuerte">
   <button class="modal-close" type="button" id="closeModal" aria-label="Cerrar ventana">✕</button>
   <div id="modalBody"></div>
  </div>
 </div>
 <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
 <noscript><p class="noscript">Activa JavaScript para consultar UYC.</p></noscript>
</body>
</html>
